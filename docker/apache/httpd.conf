# Apache HTTP Server Configuration for Hippo Equity Research App
# Configured with mod_proxy and mod_ratelimit

ServerRoot "/usr/local/apache2"
Listen 80
Listen 443
User daemon
Group daemon

# Load required modules
LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule headers_module modules/mod_headers.so
LoadModule deflate_module modules/mod_deflate.so
LoadModule ssl_module modules/mod_ssl.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule filter_module modules/mod_filter.so
LoadModule setenvif_module modules/mod_setenvif.so
LoadModule ratelimit_module modules/mod_ratelimit.so
LoadModule env_module modules/mod_env.so
LoadModule unixd_module modules/mod_unixd.so

# Server configuration
ServerName localhost
ServerAdmin admin@hippo-equity.com

# Error and access logs
ErrorLog /proc/self/fd/2
LogLevel warn
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined
CustomLog /proc/self/fd/1 combined

# MPM Event configuration for better performance
<IfModule mpm_event_module>
    StartServers 3
    MinSpareThreads 75
    MaxSpareThreads 250
    ThreadsPerChild 25
    MaxRequestWorkers 400
    MaxConnectionsPerChild 10000
</IfModule>

# Enable compression
<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css text/javascript application/javascript application/json
    BrowserMatch ^Mozilla/4 gzip-only-text/html
    BrowserMatch ^Mozilla/4\.0[678] no-gzip
    BrowserMatch \bMSIE !no-gzip !gzip-only-text/html
</IfModule>

# SSL Configuration (for HTTPS)
<IfModule mod_ssl.c>
    <VirtualHost *:443>
        ServerName localhost
        SSLEngine on
        SSLCertificateFile /usr/local/apache2/conf/ssl/server.crt
        SSLCertificateKeyFile /usr/local/apache2/conf/ssl/server.key
        
        # Security headers
        Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "DENY"
        Header always set X-XSS-Protection "1; mode=block"
        
        # Proxy to API Gateway
        ProxyPreserveHost On
        ProxyPass /api/ http://api-gateway:3000/
        ProxyPassReverse /api/ http://api-gateway:3000/
        
        # Rate limiting for API endpoints
        <Location /api/>
            <IfModule mod_ratelimit.c>
                # Rate limit: 100 requests per minute per IP
                # This prevents service degradation under high load (Requirement 7.4)
                SetOutputFilter RATE_LIMIT
                SetEnv rate-limit 100
                
                # Burst allowance: allow up to 20 requests in quick succession
                SetEnv rate-burst 20
            </IfModule>
        </Location>
        
        # Error handling
        ErrorLog /proc/self/fd/2
        CustomLog /proc/self/fd/1 combined
    </VirtualHost>
</IfModule>

# HTTP to HTTPS redirect
<VirtualHost *:80>
    ServerName localhost
    
    # Redirect all HTTP traffic to HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]
    
    # For development, allow direct access to API Gateway
    ProxyPreserveHost On
    ProxyPass /api/ http://api-gateway:3000/
    ProxyPassReverse /api/ http://api-gateway:3000/
    
    # Rate limiting for API endpoints
    <Location /api/>
        <IfModule mod_ratelimit.c>
            # Rate limit: 100 requests per minute per IP
            # This prevents service degradation under high load (Requirement 7.4)
            SetOutputFilter RATE_LIMIT
            SetEnv rate-limit 100
            
            # Burst allowance: allow up to 20 requests in quick succession
            SetEnv rate-burst 20
        </IfModule>
    </Location>
    
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>

# Proxy settings with connection pooling
ProxyRequests Off
ProxyPreserveHost On
ProxyTimeout 300

# Connection pooling for proxy
<IfModule mod_proxy.c>
    # Enable connection pooling to backend
    ProxyPassReverse /api/ http://api-gateway:3000/
    
    # Connection pool settings
    ProxyMaxForwards 10
    ProxyBadHeader IsError
    
    # Connection reuse
    ProxyPassReverseCookiePath /api/ /
</IfModule>

# Timeout settings
Timeout 300
KeepAlive On
MaxKeepAliveRequests 100
KeepAliveTimeout 15

# Caching headers for static and API responses
<IfModule mod_headers.c>
    # Security headers for all responses
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    
    # Cache-Control headers for API responses
    # Cache API responses for 5 minutes (300 seconds)
    <LocationMatch "^/api/">
        Header set Cache-Control "public, max-age=300, must-revalidate"
        Header set ETag "Apache"
        Header unset Last-Modified
    </LocationMatch>
    
    # Cache static assets for 1 year
    <LocationMatch "\.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$">
        Header set Cache-Control "public, max-age=31536000, immutable"
        Header set Expires "Thu, 31 Dec 2025 23:59:59 GMT"
    </LocationMatch>
</IfModule>
